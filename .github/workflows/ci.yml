name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Тести з покриттям (L6-09, #256): модульні, API та інтеграційні — на PostgreSQL,
  # як у робочому середовищі, тож тест REL-001 (10 паралельних бронювань) не пропускається.
  # Налаштування покриття (source, branch, omit) — у pyproject.toml, [tool.coverage.*].
  tests:
    name: Tests with coverage
    runs-on: [self-hosted, linux]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reserveflow
          POSTGRES_DB: reserveflow_test
          # Тимчасова БД лише для тестів у CI, тож вхід без пароля (жодного секрету в workflow)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U reserveflow -d reserveflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg://reserveflow@localhost:${{ job.services.postgres.ports['5432'] }}/reserveflow_test
        run: pytest tests -q --cov --cov-report=term-missing --cov-report=html

      # Ворота покриття (L6-13, #260; рішення T-03 у #248): кожен файл ≥ 80 % (рядки + гілки).
      # Загальний поріг (fail_under у pyproject.toml) перевіряє pytest-cov у кроці вище;
      # тут — поріг для кожного файлу, щоб слабкий модуль не ховався за середнім.
      - name: Coverage gate (each file >= 80 %)
        run: |
          coverage json -q -o coverage.json
          python - <<'EOF'
          import json
          import os

          THRESHOLD = 80
          files = json.load(open("coverage.json"))["files"]
          low = {
              name: data["summary"]["percent_covered"]
              for name, data in files.items()
              if data["summary"]["percent_covered"] < THRESHOLD
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if low:
                  summary.write(f"### ❌ Ворота покриття: {len(low)} файл(ів) < {THRESHOLD} %\n")
                  for name, pct in sorted(low.items()):
                      print(f"::error file={name}::Покриття {pct:.1f} % < {THRESHOLD} %")
                      summary.write(f"- `{name}` — {pct:.1f} %\n")
              else:
                  summary.write(f"### ✅ Ворота покриття: усі файли ≥ {THRESHOLD} %\n")
          if low:
              raise SystemExit(1)
          print(f"Усі файли ({len(files)}) мають покриття ≥ {THRESHOLD} %")
          EOF

      - name: Coverage summary
        if: always()
        run: |
          echo "## Покриття тестами" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report (htmlcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov/
          retention-days: 14

  # Перевірка синтаксису та рендер UML-діаграм (задача #90 / L3-17)
  uml:
    runs-on: [self-hosted, linux]
    env:
      PLANTUML_VERSION: "1.2024.7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17.0.20+8"
          # 17.0.21+9: Adoptium віддає хибне посилання (404), 22.10.2026; повернути "17", коли виправлять

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: curl -sSL -o plantuml.jar "https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Check .puml syntax
        run: java -jar plantuml.jar -checkonly -failfast2 docs/architecture/uml/*.puml

      - name: Render diagrams to SVG
        run: java -jar plantuml.jar -tsvg -charset UTF-8 -o "$GITHUB_WORKSPACE/build/uml" docs/architecture/uml/*.puml

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: build/uml/

  # Перевірка, що docs/api/openapi-generated.yaml актуальний (L4-10, #143).
  # Специфікацію генерує код (D-07), тому ручні зміни в YAML або забутий
  # перегенерований файл роблять цю job червоною. Тести — у job `tests`.
  api:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate OpenAPI
        run: python src/api/export_openapi.py

      - name: Check OpenAPI is up to date
        run: |
          # git status бачить і змінений, і ще не закомічений файл (git diff — лише перше)
          changes=$(git status --porcelain -- docs/api/openapi-generated.yaml docs/api/openapi-generated.json)
          if [ -n "$changes" ]; then
            echo "::error file=docs/api/openapi-generated.yaml::OpenAPI застарів. Запустіть 'python src/api/export_openapi.py' і закомітьте docs/api/openapi-generated.*"
            echo "$changes"
            git --no-pager diff --stat -- docs/api/
            exit 1
          fi
          echo "OpenAPI актуальний"

  # Перевіряє вихідний код на відповідність стандартам PEP 8 та шукає вразливості (black, flake8, bandit)
  lint:
    name: Code Quality and Security Linting
    runs-on: [self-hosted, linux]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (Black)
        run: black --check src/ tests/

      - name: Check style (Flake8)
        run: flake8 src/ tests/

      - name: Security analysis (Bandit)
        run: bandit -c pyproject.toml -r src/ -ll
