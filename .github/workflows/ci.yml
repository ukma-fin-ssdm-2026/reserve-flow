name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run passing test
        run: echo "Hello World"

  # Перевірка синтаксису та рендер UML-діаграм (задача #90 / L3-17)
  uml:
    runs-on: ubuntu-latest
    env:
      PLANTUML_VERSION: "1.2024.7"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: curl -sSL -o plantuml.jar "https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Check .puml syntax
        run: java -jar plantuml.jar -checkonly -failfast2 docs/architecture/uml/*.puml

      - name: Render diagrams to SVG
        run: java -jar plantuml.jar -tsvg -charset UTF-8 -o "$GITHUB_WORKSPACE/build/uml" docs/architecture/uml/*.puml

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: uml-diagrams
          path: build/uml/

  # Тести API і перевірка, що docs/api/openapi-generated.yaml актуальний (L4-10, #143).
  # Специфікацію генерує код (D-07), тому ручні зміни в YAML або забутий
  # перегенерований файл роблять цю job червоною.
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest tests -q

      - name: Regenerate OpenAPI
        run: python src/api/export_openapi.py

      - name: Check OpenAPI is up to date
        run: |
          # git status бачить і змінений, і ще не закомічений файл (git diff — лише перше)
          changes=$(git status --porcelain -- docs/api/openapi-generated.yaml docs/api/openapi-generated.json)
          if [ -n "$changes" ]; then
            echo "::error file=docs/api/openapi-generated.yaml::OpenAPI застарів. Запустіть 'python src/api/export_openapi.py' і закомітьте docs/api/openapi-generated.*"
            echo "$changes"
            git --no-pager diff --stat -- docs/api/
            exit 1
          fi
          echo "OpenAPI актуальний"
