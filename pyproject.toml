[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".pytest_cache"]

[tool.coverage.run]
source = ["src/api"]
branch = true
omit = [
    "src/api/mocks.py",
    "src/api/seed.py",
    "src/api/config.py",
    "src/api/mcp_server.py",
    "src/api/export_openapi.py"
]
[tool.coverage.report]
show_missing = true
# У src/api немає __init__.py: без цього файли, які жоден тест не імпортує, не потрапляють у звіт
include_namespace_packages = true
# Ворота покриття (L6-13, #260): загальний поріг; поріг для кожного файлу — у ci.yml
fail_under = 80
# Запуск сервера вручну (python main.py) — не код застосунку, тестами не перевіряється
exclude_also = [
    'if __name__ == "__main__":',
]

[tool.pytest.ini_options]
# --strict-markers: описка в назві мітки (наприклад, @pytest.mark.reqs) — помилка, а не тихий пропуск
addopts = "--strict-markers"
markers = [
    "req(*ids): ID вимог з docs/requirements/rtm.md, які перевіряє тест (Лаб 7, #326)",
    "no_req(reason): тест свідомо без вимоги — з поясненням чому (інфраструктура тощо)",
]

# Перевірка простежуваності «вимога ↔ тест» (scripts/check_traceability.py, Лаб 7, #326).
# Вимоги поза обсягом тестування — з причиною (узгоджено з розділом «Обсяг» docs/validation/test-plan.md).
# Вимога без тесту, якої тут немає, валить CI.
[tool.traceability.out_of_scope]
"FR-004" = "багатомовність інтерфейсу: фронтенду в репозиторії немає"
"FR-011" = "модерація кімнат адміністратором: кінцевих точок ще немає"
"FR-015" = "логування помилок доставки й повторні спроби: сервісу доставки ще немає"
"PERF-002" = "час ініціювання нагадування: сервісу доставки ще немає"
"REL-002" = "успішність доставки нагадувань: сервісу доставки ще немає"
